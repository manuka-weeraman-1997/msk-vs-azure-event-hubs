# Declarative topic definition. Used as documentation: nothing applies this file.
# On MSK create the topic with kafka-topics.sh (see ../README.md).
# On Event Hubs create the event hub with Terraform or the portal.

name: market-events           # topic (MSK) / event hub (Event Hubs)
partitions: 4
partition_key: symbol         # producer sets the message key to the symbol
retention:
  hours: 24                   # kafka: retention.ms=86400000 ; Event Hubs: 1 day
ordering: per-partition       # no ordering guarantee across partitions

msk:
  replication_factor: 3       # match your broker count / AZ layout
  config:
    retention.ms: "86400000"
    cleanup.policy: delete

event_hubs:
  # Kafka replication settings are not exposed; the service manages durability.
  namespace: streaming-prod   # placeholder: real namespace names are globally unique
  message_retention_days: 1
  consumer_groups:
    - search-service
    - analytics
    - $Default

consumer_groups:
  - name: search-service
    members: 4                # C1..C4, one per partition
    purpose: downstream search indexing

event_schema: ../../examples/event-schema.json
